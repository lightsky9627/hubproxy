[server]
host = "0.0.0.0"
port = 5000
# 管理后台安全路径，可自定义如 "/admin" 或 "/secret-admin"；留空 "" 则关闭后台入口
adminPath = "/admin"
enableH2C = false
enableFrontend = true

[rateLimit]
requestLimit = 1000
periodHours = 1.0

[security]
whiteList = []
blackList = []

[access]
# 镜像代理黑白名单（留空表示不限制）
whiteList = []
blackList = []
# 外网代理 (支持 http:// 或 socks5://，国内拉取外网慢时可配置)
proxy = ""

# 8 大主流官方镜像源标准化映射
[registries]

[registries."ghcr.io"]
upstream = "ghcr.io"
authHost = "ghcr.io/token"
authType = "github"
enabled = true

[registries."gcr.io"]
upstream = "gcr.io"
authHost = "gcr.io/v2/token"
authType = "google"
enabled = true

[registries."quay.io"]
upstream = "quay.io"
authHost = "quay.io/v2/auth"
authType = "quay"
enabled = true

[registries."registry.k8s.io"]
upstream = "registry.k8s.io"
authHost = "registry.k8s.io/token"
authType = "anonymous"
enabled = true

[registries."mcr.microsoft.com"]
upstream = "mcr.microsoft.com"
authHost = "mcr.microsoft.com"
authType = "anonymous"
enabled = true

[registries."nvcr.io"]
upstream = "nvcr.io"
authHost = "nvcr.io/proxy_auth"
authType = "anonymous"
enabled = true

[registries."docker.elastic.co"]
upstream = "docker.elastic.co"
authHost = "docker-auth.elastic.co/auth"
authType = "anonymous"
enabled = true

[tokenCache]
enabled = true
defaultTTL = "20m"
