<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>镜像检索 - HubProxy</title>
  <link rel="icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
  </style>
</head>
<body class="bg-[#f8fafc] dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- Topbar -->
  <header class="h-14 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30 select-none shadow-sm">
    <div class="flex items-center space-x-6">
      <a href="/" class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-blue-500/30">
          <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div class="flex items-baseline space-x-1.5">
          <span class="font-bold text-base tracking-tight text-slate-900 dark:text-white">HubProxy</span>
          <span class="text-xs px-1.5 py-0.5 rounded font-medium bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400">Search</span>
        </div>
      </a>

      <nav class="hidden sm:flex items-center space-x-1 text-sm font-medium text-slate-600 dark:text-slate-300">
        <a href="/" class="px-3 py-1.5 rounded-md hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">首页</a>
        <a href="/search.html" class="px-3 py-1.5 rounded-md text-blue-600 dark:text-blue-400 bg-blue-50/60 dark:bg-blue-950/40">镜像检索</a>
        <a href="/images.html" class="px-3 py-1.5 rounded-md hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">离线打包</a>
        <a href="/admin" class="px-3 py-1.5 rounded-md hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">控制台</a>
      </nav>
    </div>

    <div class="flex items-center space-x-2">
      <button id="themeToggle" class="p-2 text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
      </button>
      <a href="/admin" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs shadow-sm transition flex items-center space-x-1">
        <i data-lucide="user" class="w-3.5 h-3.5"></i>
        <span>Console</span>
      </a>
    </div>
  </header>

  <!-- Main Container (复刻 1ms.run 搜索风格) -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">
    
    <!-- 头部搜索框组合 (源仓库选择 + 关键词输入 + 搜索按钮) -->
    <div class="space-y-3">
      <form id="searchForm" onsubmit="handleSearch(event)" class="flex shadow-sm rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-hidden focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:border-blue-500 transition-all">
        <!-- 平台下拉框 -->
        <select id="registrySelect" class="bg-slate-50/80 dark:bg-slate-800/70 border-r border-slate-200 dark:border-slate-800 px-3.5 text-xs font-semibold text-slate-700 dark:text-slate-200 outline-none cursor-pointer hover:bg-slate-100 transition">
          <option value="docker.io">Docker Hub (官方)</option>
          <option value="quay.io">Quay.io (RedHat)</option>
        </select>

        <!-- 输入框 -->
        <div class="flex-1 flex items-center px-3.5">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2 shrink-0"></i>
          <input type="text" id="searchInput" placeholder="搜索容器镜像，例如：nginx, redis, mysql..." class="w-full bg-transparent text-sm text-slate-800 dark:text-slate-100 outline-none py-3 placeholder:text-slate-400">
        </div>

        <!-- 搜索按钮 -->
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-6 py-3 transition shrink-0 flex items-center space-x-1.5">
          <span>搜索</span>
        </button>
      </form>

      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <span>支持官方 Docker Hub 及 Quay 仓库开源镜像直接检索与一键加速拉取</span>
        <span id="searchResultSummary"></span>
      </div>
    </div>

    <!-- 结果列表区 -->
    <div id="resultsContainer" class="space-y-3">
      <!-- 初始默认欢迎状态 -->
      <div id="initHint" class="text-center py-16 space-y-3">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-50 dark:bg-blue-950/40 text-blue-500 flex items-center justify-center">
          <i data-lucide="compass" class="w-7 h-7"></i>
        </div>
        <h3 class="font-bold text-base text-slate-700 dark:text-slate-200">全网容器镜像快速检索</h3>
        <p class="text-xs text-slate-400 max-w-sm mx-auto">输入关键词即可检索上游 Docker Hub 与各类 Registry 镜像，点击直接获取加速拉取命令与离线导出。</p>
      </div>

      <!-- Loading -->
      <div id="loadingBox" class="hidden text-center py-16 space-y-3">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-blue-600 border-t-transparent"></div>
        <div class="text-xs text-slate-400">正在从上游镜像中心检索中...</div>
      </div>

      <!-- 搜索结果列表容器 -->
      <div id="repoList" class="space-y-3"></div>
    </div>

  </main>

  <script>
    // Theme Handler
    const themeBtn = document.getElementById('themeToggle');
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
    });

    const host = window.location.host;

    // 解析 URL 参数初始化
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('query') || urlParams.get('q') || '';
    const initialReg = urlParams.get('registry') || 'docker.io';

    if (initialQuery) {
      document.getElementById('searchInput').value = initialQuery;
      document.getElementById('registrySelect').value = initialReg;
      executeSearch(initialQuery, initialReg);
    }

    function handleSearch(e) {
      e.preventDefault();
      const q = document.getElementById('searchInput').value.trim();
      const reg = document.getElementById('registrySelect').value;
      if (!q) return;

      const newUrl = `${window.location.pathname}?query=${encodeURIComponent(q)}&registry=${encodeURIComponent(reg)}`;
      window.history.pushState({}, '', newUrl);
      executeSearch(q, reg);
    }

    async function executeSearch(query, registry) {
      document.getElementById('initHint').classList.add('hidden');
      document.getElementById('loadingBox').classList.remove('hidden');
      document.getElementById('repoList').innerHTML = '';
      document.getElementById('searchResultSummary').textContent = '';

      try {
        const res = await fetch(`/search?query=${encodeURIComponent(query)}&registry=${encodeURIComponent(registry)}`);
        const data = await res.json();
        document.getElementById('loadingBox').classList.add('hidden');

        if (!res.ok || !data.results || data.results.length === 0) {
          document.getElementById('repoList').innerHTML = `
            <div class="text-center py-16 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl space-y-2">
              <div class="text-slate-400 font-semibold text-sm">未找到相关镜像</div>
              <div class="text-xs text-slate-400">请尝试更换更精确的关键词或切换上游平台</div>
            </div>`;
          return;
        }

        document.getElementById('searchResultSummary').textContent = `共找到 ${data.count || data.results.length} 个结果`;

        document.getElementById('repoList').innerHTML = data.results.map(item => {
          const isOfficial = item.is_official;
          const stars = item.star_count || 0;
          const desc = item.description || '暂无详细描述';
          const name = item.name;
          const pullCmd = `docker pull ${host}/${name}:latest`;

          return `
            <div class="p-4 sm:p-5 rounded-xl border border-slate-200/90 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-blue-500/70 hover:shadow-md transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4 group">
              <div class="space-y-1.5 flex-1 min-w-0">
                <div class="flex items-center space-x-2 flex-wrap">
                  <span class="font-bold text-sm sm:text-base text-slate-800 dark:text-white truncate">${name}</span>
                  ${isOfficial ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800">官方镜像</span>` : ''}
                  <span class="text-xs text-amber-500 flex items-center space-x-0.5">
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i>
                    <span>${stars}</span>
                  </span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">${desc}</p>
                <div class="pt-1 flex items-center space-x-2">
                  <div class="text-[11px] font-mono bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded border border-slate-200/60 dark:border-slate-700/60 select-all truncate max-w-lg">
                    ${pullCmd}
                  </div>
                </div>
              </div>

              <div class="flex items-center space-x-2 shrink-0">
                <button onclick="copyCommand('${pullCmd}')" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-200 flex items-center space-x-1 transition">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  <span>复制拉取</span>
                </button>
                <a href="/images.html?image=${encodeURIComponent(name)}" class="px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/50 hover:bg-blue-100 text-blue-600 dark:text-blue-400 text-xs font-medium flex items-center space-x-1 transition">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                  <span>离线 Tar</span>
                </a>
              </div>
            </div>
          `;
        }).join('');

        lucide.createIcons();
      } catch (err) {
        document.getElementById('loadingBox').classList.add('hidden');
        document.getElementById('repoList').innerHTML = `
          <div class="text-center py-10 text-rose-500 text-xs bg-rose-50 dark:bg-rose-950/30 rounded-xl border border-rose-200 dark:border-rose-900">
            搜索请求异常，请检查网络或稍后重试
          </div>`;
      }
    }

    function copyCommand(text) {
      navigator.clipboard.writeText(text);
      alert('拉取命令已复制到剪贴板！');
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
